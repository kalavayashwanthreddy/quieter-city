<!DOCTYPE html>
<html>
<head>
  <title>OSRM Noise Routing Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
    body { margin: 0; }
    .legend {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 15px; border-radius: 8px; font-family: Arial;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .status {
      position: absolute; bottom: 10px; left: 10px; z-index: 1000;
      background: #fff3cd; color: #7a5c00; padding: 8px 12px;
      border-radius: 6px; font-family: Arial; display: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="legend">
    <h3>Route Selection</h3>
    <div><span style="color: gray;">╍╍╍</span> Shortest Route (High Noise)</div>
    <div><span style="color: green;">━━━</span> Best Balance (Short &amp; Quiet)</div>
    <div><span style="color: blue;">━━━</span> Least Sound Pollution</div>
  </div>

  <div id="status" class="status"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize map centered on Bengaluru
    const map = L.map('map').setView([12.9716, 77.5946], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Start and End points (MG Road to Koramangala), as [lng, lat] for OSRM
    const start = [77.6066, 12.9716]; // MG Road
    const end = [77.6206, 12.9345];   // Koramangala

    L.marker([start[1], start[0]]).addTo(map).bindPopup("Start");
    L.marker([end[1], end[0]]).addTo(map).bindPopup("Destination");

    // Fetch routes from OSRM with alternatives=true.
    // Note: geometries=geojson is REQUIRED here — the code below reads
    // route.geometry.coordinates, which only exists in GeoJSON output.
    async function getRoutes() {
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?alternatives=true&geometries=geojson&overview=full`;

      try {
        const response = await fetch(osrmUrl);
        if (!response.ok) throw new Error(`OSRM responded with ${response.status}`);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          drawRoutes(data.routes);
        } else {
          showStatus("OSRM returned no routes (message: " + (data.message || "unknown") + ")");
        }
      } catch (error) {
        console.error("Error fetching OSRM routes:", error);
        showStatus("Could not fetch routes from the OSRM public API (it is rate-limited). Try again in a minute.");
      }
    }

    function showStatus(message) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.style.display = 'block';
    }

    function drawRoutes(routes) {
      // NOTE: This is a demo mock. OSRM only returns the fastest route plus
      // its alternatives — it does NOT sort them by noise level, and it may
      // return as few as one route. Index-based styling labels the 2nd and
      // 3rd results as "balanced" / "quietest" for illustration only.

      routes.forEach((route, index) => {
        // Swap to [lat, lng] for Leaflet
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        let routeColor, routeStyle, routeWeight;

        if (index === 0) {
          // Shortest Route (high noise): gray, dashed
          routeColor = 'gray';
          routeStyle = '10 10';
          routeWeight = 4;
        } else if (index === 1) {
          // Best balance (short & quiet): green
          routeColor = 'green';
          routeStyle = null;
          routeWeight = 6;
        } else {
          // Least sound pollution: blue
          routeColor = 'blue';
          routeStyle = null;
          routeWeight = 5;
        }

        L.polyline(coords, {
          color: routeColor,
          weight: routeWeight,
          dashArray: routeStyle,
          opacity: 0.8
        }).addTo(map);
      });

      // Make sure all drawn routes are visible
      const allCoords = routes.flatMap(r => r.geometry.coordinates.map(c => [c[1], c[0]]));
      if (allCoords.length) {
        map.fitBounds(L.latLngBounds(allCoords), { padding: [40, 40] });
      }
    }

    getRoutes();
  </script>
</body>
</html>
